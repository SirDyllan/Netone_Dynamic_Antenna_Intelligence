<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">NetOne antenna tower Arduino circuit wiring</title>
  <desc id="desc">Arduino Uno wiring to two micro servos and three LED status indicators through 220 ohm resistors. Pin map: tilt D9, azimuth D10, green D5, yellow D6, red D7, common ground.</desc>
  <defs>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #17202a; }
      .heading { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .box { fill: #f8f7f3; stroke: #42464b; stroke-width: 2; rx: 12; }
      .board { fill: #126a4d; stroke: #0a4934; stroke-width: 3; rx: 18; }
      .boardText { fill: #ffffff; }
      .power { fill: #9a2528; stroke: #6f1518; stroke-width: 2; rx: 4; }
      .ground { fill: #20252a; stroke: #101316; stroke-width: 2; rx: 4; }
      .pin { fill: #e8bf4c; stroke: #745e1f; stroke-width: 1; }
      .sig { fill: none; stroke: #e31e24; stroke-width: 4; }
      .vcc { fill: none; stroke: #ce3838; stroke-width: 4; }
      .gnd { fill: none; stroke: #292d32; stroke-width: 4; }
      .ledwire { fill: none; stroke: #c79118; stroke-width: 4; }
      .resistor { fill: #e8ddc7; stroke: #56504a; stroke-width: 2; rx: 4; }
      .led { stroke: #444; stroke-width: 2; }
    </style>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e31e24"/></marker>
  </defs>

  <rect width="1200" height="760" fill="#f1f0eb"/>
  <text x="42" y="48" class="heading">NETONE ANTENNA TOWER · ARDUINO WIRING</text>
  <text x="44" y="76" class="small">Educational simulation circuit · 9600 baud serial · not a live telecom controller</text>

  <rect x="58" y="138" width="390" height="475" class="board"/>
  <text x="253" y="177" text-anchor="middle" class="label boardText">ARDUINO UNO R3</text>
  <rect x="85" y="199" width="336" height="39" fill="#0b523a" stroke="#68a58c" rx="5"/>
  <text x="253" y="225" text-anchor="middle" class="small boardText">DIGITAL I/O</text>
  <text x="103" y="273" class="small boardText">D5</text><text x="103" y="318" class="small boardText">D6</text><text x="103" y="363" class="small boardText">D7</text>
  <text x="103" y="408" class="small boardText">D9</text><text x="103" y="453" class="small boardText">D10</text>
  <circle cx="178" cy="268" r="9" class="pin"/><circle cx="178" cy="313" r="9" class="pin"/><circle cx="178" cy="358" r="9" class="pin"/><circle cx="178" cy="403" r="9" class="pin"/><circle cx="178" cy="448" r="9" class="pin"/>
  <rect x="286" y="503" width="53" height="38" class="power"/><text x="312" y="528" text-anchor="middle" class="small boardText">5V</text>
  <rect x="350" y="503" width="53" height="38" class="ground"/><text x="376" y="528" text-anchor="middle" class="small boardText">GND</text>
  <text x="253" y="581" text-anchor="middle" class="small boardText">Use separate regulated servo power for physical hardware</text>

  <path d="M187 268H490V175H660" class="ledwire"/>
  <path d="M187 313H510V285H660" class="ledwire"/>
  <path d="M187 358H530V395H660" class="ledwire"/>
  <path d="M187 403H550V530H660" class="sig" marker-end="url(#arrowRed)"/>
  <path d="M187 448H570V650H660" class="sig" marker-end="url(#arrowRed)"/>

  <rect x="660" y="145" width="114" height="50" class="resistor"/><text x="717" y="176" text-anchor="middle" class="small">220 Ω · R1</text>
  <line x1="774" y1="170" x2="826" y2="170" class="ledwire"/><circle cx="852" cy="170" r="18" fill="#35aa67" class="led"/><text x="852" y="176" text-anchor="middle" class="small">G</text>
  <text x="888" y="166" class="label">READY</text><text x="888" y="187" class="small">D5 → R1 → green LED → GND</text>

  <rect x="660" y="255" width="114" height="50" class="resistor"/><text x="717" y="286" text-anchor="middle" class="small">220 Ω · R2</text>
  <line x1="774" y1="280" x2="826" y2="280" class="ledwire"/><circle cx="852" cy="280" r="18" fill="#f0c52c" class="led"/><text x="852" y="286" text-anchor="middle" class="small">Y</text>
  <text x="888" y="276" class="label">MOVING</text><text x="888" y="297" class="small">D6 → R2 → yellow LED → GND</text>

  <rect x="660" y="365" width="114" height="50" class="resistor"/><text x="717" y="396" text-anchor="middle" class="small">220 Ω · R3</text>
  <line x1="774" y1="390" x2="826" y2="390" class="ledwire"/><circle cx="852" cy="390" r="18" fill="#e31e24" class="led"/><text x="852" y="396" text-anchor="middle" class="small boardText">R</text>
  <text x="888" y="386" class="label">ERROR</text><text x="888" y="407" class="small">D7 → R3 → red LED → GND</text>

  <rect x="660" y="495" width="128" height="72" class="box"/><text x="724" y="522" text-anchor="middle" class="label">SV1 · TILT</text><text x="724" y="546" text-anchor="middle" class="small">Micro Servo</text>
  <rect x="660" y="615" width="128" height="72" class="box"/><text x="724" y="642" text-anchor="middle" class="label">SV2 · AZIMUTH</text><text x="724" y="666" text-anchor="middle" class="small">Micro Servo</text>
  <text x="814" y="516" class="small">Signal · orange/yellow</text><text x="814" y="539" class="small">VCC · red, regulated +5V</text><text x="814" y="562" class="small">GND · brown/black, common ground</text>
  <text x="814" y="636" class="small">Signal · orange/yellow</text><text x="814" y="659" class="small">VCC · red, regulated +5V</text><text x="814" y="682" class="small">GND · brown/black, common ground</text>

  <path d="M312 541V714H1040V540H788" class="vcc"/>
  <path d="M376 541V729H1060V566H788M1060 566V687H788" class="gnd"/>
  <text x="1072" y="543" class="small" fill="#9a2528">+5V servo supply</text>
  <text x="1072" y="570" class="small">COMMON GND</text>
  <text x="1072" y="702" class="tiny">LED cathodes return to GND</text>

  <rect x="54" y="711" width="948" height="30" fill="#fff7dd" stroke="#d0a832" rx="5"/>
  <text x="68" y="731" class="small">Physical build: regulated supply rated for both servos; join grounds. Never power loaded servos from USB alone.</text>
</svg>
